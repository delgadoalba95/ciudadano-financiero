<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Las 3 habilidades del dinero — Ciudadano Financiero</title>
<meta name="description" content="El vídeo con el que entender cómo funciona tu dinero y empezar a multiplicarlo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.loom.com">
<link rel="preconnect" href="https://cdn.loom.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ECE3CB;
    --surface-2: #F5EFDC;
    --ink: #1C2B42;
    --ink-soft: #48597D;
    --ink-faint: #7C88A3;
    --accent: #A9832E;
    --accent-strong: #8C6D25;
    --accent-ink: #152A47;
    --rule: #C9BA8C;
    --shadow: rgba(28, 43, 66, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101B2C;
      --surface-2: #1D2E49;
      --ink: #EFE7D2;
      --ink-soft: #B4BFD6;
      --ink-faint: #7A87A3;
      --accent: #D9B35C;
      --accent-strong: #EBCB80;
      --accent-ink: #1B1404;
      --rule: #334563;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* La misma cabecera que el resto de la web. */
  header.site { background: #122641; }
  .nav-row { display: flex; align-items: center; padding: 16px 26px; }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "Newsreader", serif;
    font-weight: 600;
    font-size: 0.98rem;
    letter-spacing: 0.03em;
    text-decoration: none;
    color: #F5F1E6;
  }
  .logo svg { flex: none; }

  main {
    flex: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 4px 24px 32px;
    text-align: center;
  }

  h1 {
    font-family: "Newsreader", serif;
    font-weight: 600;
    /* En pantalla de ordenador tiene que caber en una sola línea. */
    font-size: clamp(25px, 4vw, 44px);
    line-height: 1.12;
    letter-spacing: -0.02em;
    margin: 16px auto 8px;
    text-wrap: balance;
  }
  /* Etiqueta pequeña que dice de qué va el vídeo que viene debajo. */
  .etiqueta-video {
    margin: 0 0 12px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* El vídeo es lo único que importa aquí. Es 16:9: lo que dice la API de Loom
     sobre su tamaño no es de fiar, se comprueba mirando si salen franjas. */
  .video {
    position: relative;
    /* Se limita por altura para que el botón de compra entre en pantalla
       sin tener que bajar. */
    height: min(60vh, 620px);
    aspect-ratio: 16 / 9;
    width: auto;
    max-width: 100%;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 14px;
    border: 1px solid var(--rule);
    background: #000 center/cover no-repeat;
    box-shadow: 0 18px 50px var(--shadow);
  }
  .video iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }

  .compra { margin-top: 18px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 620px;
    padding: 20px 28px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Public Sans", sans-serif;
    font-size: clamp(16px, 2.4vw, 20px);
    font-weight: 700;
    line-height: 1.25;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  .btn:hover { background: var(--accent-strong); transform: translateY(-1px); }

  .aviso {
    margin: 14px auto 0;
    max-width: 620px;
    font-size: 13.5px;
    color: var(--ink-faint);
    line-height: 1.5;
  }
  .aviso[hidden] { display: none; }

  footer {
    padding: 0 24px 28px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-faint);
  }
  footer a { color: var(--ink-faint); }

  @media (max-width: 640px) {
    main { padding: 4px 16px 44px; }
    .nav-row { padding: 14px 18px; }
    /* En el móvil manda el ancho: si no, la caja queda más alta que el vídeo
       y aparecen bandas negras arriba y abajo. */
    .video { height: auto; width: 100%; }
    .logo-texto { font-size: 0.86rem; }
    h1 { margin-top: 18px; }
    .video { border-radius: 10px; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="nav-row">
    <a class="logo" href="/">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="30" height="30">
        <g fill="none" stroke="#F5F1E6">
          <circle cx="120" cy="120" r="104" stroke-width="7"/>
          <circle cx="120" cy="120" r="90" stroke-width="3.5"/>
        </g>
        <g fill="#F5F1E6">
          <path d="M70 72 H90 V110 H113 V130 H90 V168 H70 V72 Z"/>
          <path d="M170 72 H150 V110 H127 V130 H150 V168 H170 V72 Z"/>
        </g>
      </svg>
      <span class="logo-texto">CIUDADANO FINANCIERO</span>
    </a>
  </div>
</header>

<main>
  <h1>Las 3 habilidades del dinero</h1>

  <div class="video" id="video">
    <iframe
      src="https://www.loom.com/embed/468e4e37edd5463f8212127e77a13eba?hideEmbedTopBar=true&amp;hide_share=true&amp;hide_owner=true&amp;hide_title=true"
      title="Las 3 habilidades del dinero en detalle"
      allow="fullscreen"
      allowfullscreen></iframe>
  </div>

  <div class="compra">
    <a class="btn" id="btn-comprar" href="#">Quiero multiplicar mi dinero en 5 semanas</a>
    <p class="aviso" id="aviso" hidden></p>
  </div>
</main>

<footer>
  <a href="/">Ciudadano Financiero</a>
</footer>

<script>
  // Cuando esté lista la página de pago, se pone aquí su dirección y el botón
  // lleva directamente a ella. Mientras esté vacía, el botón avisa en vez de
  // llevar a ninguna parte.
  var PAGO_URL = "https://buy.stripe.com/8x27sM4TpdLQgbw90L0gw00";

  (function () {
    var btn = document.getElementById("btn-comprar");
    var aviso = document.getElementById("aviso");

    if (PAGO_URL) {
      btn.href = PAGO_URL;
      return;
    }

    btn.addEventListener("click", function (e) {
      e.preventDefault();
      aviso.textContent = "El pago se activa en unos días. Escríbenos a hola@ciudadanofinanciero.com y te avisamos en cuanto esté.";
      aviso.hidden = false;
    });
  })();
</script>

</body>
</html>
