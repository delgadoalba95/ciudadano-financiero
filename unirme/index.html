<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Las 3 habilidades del dinero — Ciudadano Financiero</title>
<meta name="description" content="Las 3 habilidades del dinero: el vídeo con el que entender cómo funciona tu dinero y empezar a multiplicarlo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.loom.com">
<link rel="preconnect" href="https://cdn.loom.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ECE3CB;
    --surface-2: #F5EFDC;
    --ink: #1C2B42;
    --ink-soft: #48597D;
    --ink-faint: #7C88A3;
    --accent: #A9832E;
    --accent-strong: #8C6D25;
    --accent-ink: #152A47;
    --rule: #C9BA8C;
    --shadow: rgba(28, 43, 66, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101B2C;
      --surface-2: #1D2E49;
      --ink: #EFE7D2;
      --ink-soft: #B4BFD6;
      --ink-faint: #7A87A3;
      --accent: #D9B35C;
      --accent-strong: #EBCB80;
      --accent-ink: #1B1404;
      --rule: #334563;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Public Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .marca {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 24px; text-decoration: none; color: var(--ink);
  }
  .marca .sello {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--accent); color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: "Newsreader", serif; font-size: 17px; font-weight: 600;
  }
  .marca .texto {
    font-family: "IBM Plex Mono", monospace; font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase; line-height: 1.3;
    color: var(--ink-soft);
  }
  .marca .texto span { display: block; }

  main {
    flex: 1;
    width: 100%;
    max-width: 1060px;
    margin: 0 auto;
    padding: 8px 24px 56px;
    text-align: center;
  }

  h1 {
    font-family: "Newsreader", serif;
    font-weight: 600;
    font-size: clamp(32px, 6vw, 56px);
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 18px 0 26px;
  }

  /* El vídeo es lo único que importa aquí: ocupa todo el ancho disponible. */
  .video {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 14px;
    border: 1px solid var(--rule);
    background: #000 center/cover no-repeat;
    box-shadow: 0 18px 50px var(--shadow);
  }
  .video iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }

  .compra { margin-top: 38px; }

  .btn {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 100%;
    max-width: 620px;
    padding: 20px 28px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Public Sans", sans-serif;
    font-size: clamp(16px, 2.4vw, 20px);
    font-weight: 700;
    line-height: 1.25;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  .btn:hover { background: var(--accent-strong); transform: translateY(-1px); }
  .btn .precio {
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    opacity: 0.85;
  }

  .aviso {
    margin: 14px auto 0;
    max-width: 620px;
    font-size: 13.5px;
    color: var(--ink-faint);
    line-height: 1.5;
  }
  .aviso[hidden] { display: none; }

  footer {
    padding: 0 24px 28px;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-faint);
  }
  footer a { color: var(--ink-faint); }

  @media (max-width: 640px) {
    main { padding: 4px 16px 44px; }
    .marca { padding: 18px 16px; }
    .video { border-radius: 10px; }
  }
</style>
</head>
<body>

<a class="marca" href="/">
  <span class="sello">H</span>
  <span class="texto"><span>Ciudadano</span><span>Financiero</span></span>
</a>

<main>
  <h1>Las 3 habilidades del dinero</h1>

  <div class="video" id="video">
    <iframe
      src="https://www.loom.com/embed/d038f0e908754658bb70165ee0dc1c72?hideEmbedTopBar=true&amp;hide_share=true&amp;hide_owner=true&amp;hide_title=true"
      title="Las 3 habilidades del dinero"
      allow="fullscreen"
      allowfullscreen></iframe>
  </div>

  <div class="compra">
    <a class="btn" id="btn-comprar" href="#">
      Quiero aprender a gestionar mi dinero y a multiplicarlo
      <span class="precio">250 €</span>
    </a>
    <p class="aviso" id="aviso" hidden></p>
  </div>
</main>

<footer>
  <a href="/">Ciudadano Financiero</a>
</footer>

<script>
  // Cuando esté lista la página de pago, se pone aquí su dirección y el botón
  // lleva directamente a ella. Mientras esté vacía, el botón avisa en vez de
  // llevar a ninguna parte.
  var PAGO_URL = "";

  (function () {
    var btn = document.getElementById("btn-comprar");
    var aviso = document.getElementById("aviso");

    if (PAGO_URL) {
      btn.href = PAGO_URL;
      return;
    }

    btn.addEventListener("click", function (e) {
      e.preventDefault();
      aviso.textContent = "El pago se activa en unos días. Escríbenos a hola@ciudadanofinanciero.com y te avisamos en cuanto esté.";
      aviso.hidden = false;
    });
  })();
</script>

</body>
</html>
