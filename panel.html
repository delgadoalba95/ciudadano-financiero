<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Ciudadano Financiero</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ECE3CB;
    --surface: #E1D6B7;
    --surface-2: #F5EFDC;
    --ink: #1C2B42;
    --ink-soft: #48597D;
    --ink-faint: #7C88A3;
    --accent: #8C6A1E;
    --accent-strong: #6E5416;
    --accent-ink: #FBF6E8;
    --rule: #C9BA8C;
    --stamp: #7C3232;
    --bad-bg: #f6d9d1;
    --good: #3f8a4c;
    --good-bg: #d9efdc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101B2C;
      --surface: #17253C;
      --surface-2: #1D2E49;
      --ink: #EFE7D2;
      --ink-soft: #B4BFD6;
      --ink-faint: #7A87A3;
      --accent: #D9B35C;
      --accent-strong: #EBCB80;
      --accent-ink: #1B1404;
      --rule: #33456354;
      --stamp: #C25555;
      --bad-bg: #3a1a1a;
      --good: #6fbf7c;
      --good-bg: #163422;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101B2C;
    --surface: #17253C;
    --surface-2: #1D2E49;
    --ink: #EFE7D2;
    --ink-soft: #B4BFD6;
    --ink-faint: #7A87A3;
    --accent: #D9B35C;
    --accent-strong: #EBCB80;
    --accent-ink: #1B1404;
    --rule: #33456354;
    --stamp: #C25555;
    --bad-bg: #3a1a1a;
    --good: #6fbf7c;
    --good-bg: #163422;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: "Public Sans", ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: "Fraunces", Georgia, serif; margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  /* ---------- Login screen ---------- */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 36px 32px;
    max-width: 380px;
    width: 100%;
  }
  .login-card .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent-strong);
    margin-bottom: 8px;
  }
  .login-card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 22px; }
  .login-field { margin-bottom: 14px; }
  .login-field label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .login-field input {
    width: 100%;
    font-family: "Public Sans", sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 11px 13px;
  }
  .login-field input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #login-error {
    display: none;
    font-size: 0.85rem;
    color: var(--stamp);
    margin-bottom: 12px;
  }
  .btn {
    width: 100%;
    font-family: "Public Sans", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 3px;
    padding: 13px;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent-strong); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Dashboard ---------- */
  #dashboard { display: none; }
  header.panel-header {
    border-bottom: 1px solid var(--rule);
    background: var(--bg);
  }
  .panel-header-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 0.86rem;
    letter-spacing: 0.04em;
  }
  .btn-outline {
    font-family: "Public Sans", sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent-strong); }

  main.panel-main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }

  .panel-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .panel-tab {
    font-family: "Public Sans", sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    background: transparent;
    color: var(--ink-soft);
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 4px;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .panel-tab.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }
  .panel-tab:hover { color: var(--ink); }

  .email-row {
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .email-row .subject { font-weight: 600; font-size: 0.94rem; }
  .email-row .meta { font-size: 0.82rem; color: var(--ink-soft); margin-top: 2px; }
  .badge-sent { background: var(--good-bg); color: var(--good); }
  .badge-failed { background: var(--bad-bg); color: var(--stamp); }

  .stats-row {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 14px 18px;
    min-width: 130px;
  }
  .stat-card .num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 1.5rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat-card .label {
    font-size: 0.76rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-top: 2px;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  #search-input {
    flex: 1;
    min-width: 220px;
    font-family: "Public Sans", sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 10px 13px;
  }
  select.filter-select {
    font-family: "Public Sans", sans-serif;
    font-size: 0.88rem;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 10px 12px;
  }

  .contact-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .contact-row {
    background: var(--surface-2);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 14px 18px;
    cursor: pointer;
  }
  .contact-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .contact-name { font-weight: 600; font-size: 0.98rem; }
  .contact-meta {
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
    white-space: nowrap;
  }
  .badge-waitlist { background: var(--surface); color: var(--accent-strong); }
  .badge-test { background: var(--good-bg); color: var(--good); }
  .contact-date {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .contact-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font-size: 0.88rem;
  }
  .contact-detail.open { display: block; }
  .contact-detail dl { margin: 0; }
  .contact-detail dt {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-top: 10px;
  }
  .contact-detail dt:first-child { margin-top: 0; }
  .contact-detail dd { margin: 3px 0 0; }

  #empty-state, #loading-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  #loading-state { display: none; }
  #load-error {
    background: var(--bad-bg);
    border: 1px solid var(--stamp);
    color: var(--stamp);
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="eyebrow">Ciudadano Financiero</div>
    <h1>Panel privado</h1>
    <div id="login-error"></div>
    <div class="login-field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="email">
    </div>
    <div class="login-field">
      <label for="login-password">Contraseña</label>
      <input type="password" id="login-password" autocomplete="current-password">
    </div>
    <button class="btn" id="login-btn">Entrar</button>
  </div>
</div>

<div id="dashboard">
  <header class="panel-header">
    <div class="panel-header-inner">
      <div class="panel-title">PANEL · CIUDADANO FINANCIERO</div>
      <button class="btn-outline" id="logout-btn">Salir</button>
    </div>
  </header>

  <main class="panel-main">
    <div class="panel-tabs">
      <button class="panel-tab active" id="tab-btn-contacts">Contactos</button>
      <button class="panel-tab" id="tab-btn-emails">Emails enviados</button>
    </div>

    <div id="tab-contacts">
      <div class="stats-row">
        <div class="stat-card">
          <div class="num" id="stat-total">0</div>
          <div class="label">Contactos</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-waitlist">0</div>
          <div class="label">Lista de espera</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-test">0</div>
          <div class="label">Hicieron el test</div>
        </div>
      </div>

      <div class="toolbar">
        <input type="text" id="search-input" placeholder="Buscar por nombre o email...">
        <select class="filter-select" id="filter-source">
          <option value="all">Todos</option>
          <option value="waitlist">Solo lista de espera</option>
          <option value="test">Solo test</option>
        </select>
      </div>

      <div id="load-error" style="display:none;"></div>
      <div id="loading-state">Cargando contactos...</div>
      <div id="empty-state" style="display:none;">No hay contactos que coincidan con la búsqueda.</div>
      <div class="contact-list" id="contact-list"></div>
    </div>

    <div id="tab-emails" style="display:none;">
      <div class="stats-row">
        <div class="stat-card">
          <div class="num" id="stat-emails-sent">0</div>
          <div class="label">Enviados</div>
        </div>
        <div class="stat-card">
          <div class="num" id="stat-emails-failed">0</div>
          <div class="label">Fallidos</div>
        </div>
      </div>
      <div id="email-load-error" style="display:none;"></div>
      <div id="email-empty-state" style="display:none;">Todavía no se ha enviado ningún email.</div>
      <div class="contact-list" id="email-list"></div>
    </div>
  </main>
</div>

<script src="/supabase-config.js"></script>
<script>
(function () {
  const AUTH_STORAGE_KEY = "cf_panel_session";

  const loginScreen = document.getElementById("login-screen");
  const dashboard = document.getElementById("dashboard");
  const loginEmail = document.getElementById("login-email");
  const loginPassword = document.getElementById("login-password");
  const loginBtn = document.getElementById("login-btn");
  const loginError = document.getElementById("login-error");
  const logoutBtn = document.getElementById("logout-btn");

  let allContacts = [];
  let allEmails = [];
  let currentAccessToken = null;
  let emailsLoaded = false;

  function saveSession(session) {
    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
  }
  function loadSession() {
    try {
      return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || "null");
    } catch { return null; }
  }
  function clearSession() {
    localStorage.removeItem(AUTH_STORAGE_KEY);
  }

  async function login(email, password) {
    const res = await fetch(`${window.SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": window.SUPABASE_ANON_KEY },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error("Email o contraseña incorrectos.");
    return res.json();
  }

  async function refreshSession(refresh_token) {
    const res = await fetch(`${window.SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": window.SUPABASE_ANON_KEY },
      body: JSON.stringify({ refresh_token })
    });
    if (!res.ok) throw new Error("Sesión caducada.");
    return res.json();
  }

  async function fetchContacts(access_token) {
    const res = await fetch(`${window.SUPABASE_URL}/rest/v1/contacts?select=*&order=created_at.desc`, {
      headers: {
        "apikey": window.SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${access_token}`
      }
    });
    if (!res.ok) throw new Error("No se pudieron cargar los contactos. Prueba a recargar la página.");
    return res.json();
  }

  function showDashboard() {
    loginScreen.style.display = "none";
    dashboard.style.display = "block";
  }
  function showLogin(message) {
    dashboard.style.display = "none";
    loginScreen.style.display = "flex";
    if (message) {
      loginError.textContent = message;
      loginError.style.display = "block";
    }
  }

  async function fetchEmailLog(access_token) {
    const res = await fetch(`${window.SUPABASE_URL}/rest/v1/email_log?select=*&order=sent_at.desc`, {
      headers: {
        "apikey": window.SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${access_token}`
      }
    });
    if (!res.ok) throw new Error("No se pudo cargar el historial de emails.");
    return res.json();
  }

  function renderEmailLog() {
    document.getElementById("stat-emails-sent").textContent = allEmails.filter(e => e.status === "sent").length;
    document.getElementById("stat-emails-failed").textContent = allEmails.filter(e => e.status === "failed").length;

    const list = document.getElementById("email-list");
    const empty = document.getElementById("email-empty-state");

    if (allEmails.length === 0) {
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    list.innerHTML = allEmails.map(e => `
      <div class="email-row">
        <div>
          <div class="subject">${escapeHtml(e.subject)}</div>
          <div class="meta">${escapeHtml(e.email)}${e.error ? " · " + escapeHtml(e.error) : ""}</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <span class="badge ${e.status === 'sent' ? 'badge-sent' : 'badge-failed'}">${e.status === 'sent' ? 'Enviado' : 'Fallido'}</span>
          <div class="contact-date">${formatDate(e.sent_at)}</div>
        </div>
      </div>
    `).join("");
  }

  async function loadEmailLogIntoDashboard(access_token) {
    const loadError = document.getElementById("email-load-error");
    try {
      allEmails = await fetchEmailLog(access_token);
      loadError.style.display = "none";
      emailsLoaded = true;
    } catch (e) {
      allEmails = [];
      loadError.textContent = e.message || "No se pudo cargar el historial de emails.";
      loadError.style.display = "block";
    }
    renderEmailLog();
  }

  const tabBtnContacts = document.getElementById("tab-btn-contacts");
  const tabBtnEmails = document.getElementById("tab-btn-emails");
  tabBtnContacts.addEventListener("click", () => {
    tabBtnContacts.classList.add("active");
    tabBtnEmails.classList.remove("active");
    document.getElementById("tab-contacts").style.display = "block";
    document.getElementById("tab-emails").style.display = "none";
  });
  tabBtnEmails.addEventListener("click", async () => {
    tabBtnEmails.classList.add("active");
    tabBtnContacts.classList.remove("active");
    document.getElementById("tab-contacts").style.display = "none";
    document.getElementById("tab-emails").style.display = "block";
    if (!emailsLoaded && currentAccessToken) {
      await loadEmailLogIntoDashboard(currentAccessToken);
    }
  });

  // Loading contacts is separate from being logged in: a failure here (network
  // hiccup, RLS misconfigured, etc.) should show "0 contactos" with a notice —
  // never lock someone with valid credentials out of their own dashboard.
  async function loadContactsIntoDashboard(access_token) {
    currentAccessToken = access_token;
    const loadError = document.getElementById("load-error");
    try {
      allContacts = await fetchContacts(access_token);
      loadError.style.display = "none";
    } catch (e) {
      allContacts = [];
      loadError.textContent = e.message || "No se pudieron cargar los contactos.";
      loadError.style.display = "block";
    }
    renderContacts();
  }

  async function boot() {
    const session = loadSession();
    if (!session) { showLogin(); return; }

    showDashboard();
    let access_token = session.access_token;
    try {
      await fetch(`${window.SUPABASE_URL}/rest/v1/contacts?select=id&limit=1`, {
        headers: { "apikey": window.SUPABASE_ANON_KEY, "Authorization": `Bearer ${access_token}` }
      }).then(r => { if (r.status === 401) throw new Error("expired"); });
    } catch {
      try {
        const refreshed = await refreshSession(session.refresh_token);
        saveSession(refreshed);
        access_token = refreshed.access_token;
      } catch {
        clearSession();
        showLogin("Tu sesión ha caducado. Entra de nuevo.");
        return;
      }
    }
    await loadContactsIntoDashboard(access_token);
  }

  loginBtn.addEventListener("click", async () => {
    loginError.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Entrando...";
    try {
      const session = await login(loginEmail.value.trim(), loginPassword.value);
      saveSession(session);
      showDashboard();
      await loadContactsIntoDashboard(session.access_token);
    } catch (e) {
      loginError.textContent = e.message || "No se pudo iniciar sesión.";
      loginError.style.display = "block";
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = "Entrar";
    }
  });

  logoutBtn.addEventListener("click", () => {
    clearSession();
    allContacts = [];
    allEmails = [];
    emailsLoaded = false;
    currentAccessToken = null;
    showLogin();
  });

  function escapeHtml(s) {
    const div = document.createElement("div");
    div.textContent = s == null ? "" : String(s);
    return div.innerHTML;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" });
  }

  const PROFILE_LABELS = {
    vigilante: "Vigilante", obsesivo: "Obsesivo", estatus: "Estatus", evitativo: "Evitativo"
  };

  function contactRowHtml(c) {
    const badges = [];
    if (c.is_waitlist) badges.push('<span class="badge badge-waitlist">Lista de espera</span>');
    if (c.is_test) badges.push(`<span class="badge badge-test">Test: ${escapeHtml(PROFILE_LABELS[c.test_result_top] || c.test_result_top || "")}</span>`);

    let detail = "";
    if (c.is_test && c.test_result_top) {
      detail = `
        <dl>
          <dt>Perfil principal</dt><dd>${escapeHtml(PROFILE_LABELS[c.test_result_top] || c.test_result_top)}</dd>
          <dt>Segundo perfil</dt><dd>${escapeHtml(PROFILE_LABELS[c.test_result_second] || c.test_result_second || "—")}</dd>
        </dl>
      `;
    }

    return `
      <div class="contact-row" data-id="${c.id}">
        <div class="contact-row-top">
          <div>
            <div class="contact-name">${escapeHtml(c.name)}</div>
            <div class="contact-meta">${escapeHtml(c.email)} · ${escapeHtml(c.whatsapp)}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <div class="badge-row">${badges.join("")}</div>
            <div class="contact-date">${formatDate(c.created_at)}</div>
          </div>
        </div>
        ${detail ? `<div class="contact-detail">${detail}</div>` : ""}
      </div>
    `;
  }

  function renderContacts() {
    const q = document.getElementById("search-input").value.trim().toLowerCase();
    const filter = document.getElementById("filter-source").value;

    let filtered = allContacts.filter(c => {
      const matchesQuery = !q || c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q);
      const matchesFilter = filter === "all" || (filter === "waitlist" && c.is_waitlist) || (filter === "test" && c.is_test);
      return matchesQuery && matchesFilter;
    });

    document.getElementById("stat-total").textContent = allContacts.length;
    document.getElementById("stat-waitlist").textContent = allContacts.filter(c => c.is_waitlist).length;
    document.getElementById("stat-test").textContent = allContacts.filter(c => c.is_test).length;

    const list = document.getElementById("contact-list");
    const empty = document.getElementById("empty-state");

    if (filtered.length === 0) {
      list.innerHTML = "";
      empty.textContent = allContacts.length === 0
        ? "Todavía no tienes contactos. En cuanto alguien se apunte a la lista de espera o haga el test, aparecerá aquí."
        : "No hay contactos que coincidan con la búsqueda.";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    list.innerHTML = filtered.map(contactRowHtml).join("");

    list.querySelectorAll(".contact-row").forEach(row => {
      row.addEventListener("click", () => {
        const d = row.querySelector(".contact-detail");
        if (d) d.classList.toggle("open");
      });
    });
  }

  document.getElementById("search-input").addEventListener("input", renderContacts);
  document.getElementById("filter-source").addEventListener("change", renderContacts);

  boot();
})();
</script>
</body>
</html>
